# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: Julien-D234/PORTFOLIO_V2
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/5b8519f4-9c46-4039-9fc1-b60bf71fa2f2/pkce
  auth_token_endpoint: /sites/5b8519f4-9c46-4039-9fc1-b60bf71fa2f2/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://julien-d234.github.io

# Media files
media_folder: public/images
public_folder: /images

# Collections
collections:
  - name: projects
    label: Projets
    label_singular: Projet
    folder: src/content/projects
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title.fr}}"
    fields:
      - name: title
        label: Titre
        widget: object
        fields:
          - { name: fr, label: Français, widget: string }
          - { name: en, label: English, widget: string }
      - name: description
        label: Description
        widget: object
        fields:
          - { name: fr, label: Français, widget: text }
          - { name: en, label: English, widget: text }
      - name: techs
        label: Technologies
        widget: list
        field: { name: tech, label: Techno, widget: string }
      - { name: link, label: Lien, widget: string, required: false }
      - { name: image, label: Image, widget: image, required: false }
      - { name: order, label: Ordre, widget: number, default: 0 }
      - { name: published, label: Publié, widget: boolean, default: true }
